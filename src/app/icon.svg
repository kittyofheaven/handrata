  <path
    transform="translate(134.25 66) scale(1.4195) translate(-165.799 -126.511)"
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M206.68 159.118V126.511H337.317V166.879H214.441V354.025H337.317V394.209H165.799V159.118H206.68Z"
    fill="#FCFCFC"
  />
</svg>
